title: ETW Sources
backends:
    - aurora agent
logsources:
    # Definitions for all ETW channels that we subscribe to
    windows-kernel-file-create:
        product: windows
        service: kernel-file-create
        sources:
            - "WinEventLog:Microsoft-Windows-Kernel-File/KERNEL_FILE_KEYWORD_CREATE_NEW_FILE"
    windows-kernel-file-deletion:
        product: windows
        service: kernel-file-deletion
        sources:
            - "WinEventLog:Microsoft-Windows-Kernel-File/KERNEL_FILE_KEYWORD_DELETE_PATH"
    # Deactivated for performance
    #windows-kernel-file-open:
    #    product: windows
    #    service: kernel-file-open
    #    sources:
    #        - "WinEventLog:Microsoft-Windows-Kernel-File/KERNEL_FILE_KEYWORD_CREATE"
    windows-kernel-process:
        product: windows
        service: kernel-process
        sources:
            - "WinEventLog:Microsoft-Windows-Kernel-Process/WINEVENT_KEYWORD_PROCESS"
    # Deactivated for performance
    #windows-kernel-process-thread:
    #    product: windows
    #    service: kernel-process-thread
    #    sources:
    #        - "WinEventLog:Microsoft-Windows-Kernel-Process/WINEVENT_KEYWORD_THREAD"
    # Deactivated for performance
    #windows-kernel-process-image:
    #    product: windows
    #    service: kernel-process-image
    #    sources:
    #        - "WinEventLog:Microsoft-Windows-Kernel-Process/WINEVENT_KEYWORD_IMAGE"
    windows-tcpip:
        product: windows
        service: tcpip
        sources:
            - "WinEventLog:Microsoft-Windows-TCPIP/ut:ConnectPath"
    kernel_pnp:
        product: windows
        service: pnp
        sources:
            - "WinEventLog:Microsoft-Windows-Kernel-PnP/DriverLoad"
            - "WinEventLog:Microsoft-Windows-Kernel-PnP/DriverUnload"
            - "WinEventLog:Microsoft-Windows-Kernel-PnP/DriverInit"
    #windows-api-call-auditing:
    #    product: windows
    #    service: api-call-auditing
    #    sources:
    #        - "WinEventLog:Microsoft-Windows-Kernel-Audit-API-Calls"
    windows-dns-client:
        product: windows
        service: dns-client
        sources:
            - "WinEventLog:Microsoft-Windows-DNS-Client"
    # Aurora internal provider, regularly enumerates all handles on the system. Each entry contains the fields:
    # Handle, Name, Type, ProcessId, Image, CommandLine, User
    handle-polling:
        product: windows
        service: handlepolling
        sources:
            - "PollHandles"
    # windows-powershell-operational:
    #    product: windows
    #    service: powershell
    #    sources:
    #        - "WinEventLog:Microsoft-Windows-PowerShell"
    kernel_process:
        product: windows
        service: systemlogger-process
        sources:
            - "SystemLogger:Process"
    # Deactivated for performance
    #kernel_registry:
    #    product: windows
    #    service: systemlogger-registry
    #    sources:
    #        - "SystemLogger:Registry"
    #windows-kernel-handles:
    #    product: windows
    #    service: kernel-handles
    #    sources:
    #        - "SystemLogger:Handle"
    windows-defender:
        product: windows
        service: windefend
        sources:
            - 'WinEventLog:Microsoft-Windows-Windows Defender/Operational'
    windows-taskscheduler:
        product: windows
