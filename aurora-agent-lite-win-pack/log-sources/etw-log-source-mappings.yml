title: ETW Source Mappings
backends:
    - aurora agent
logsources:
    # Sysmon Event ID 1 - Process creation
    kernel_process_creation:
        category: process_creation
        product: windows
        conditions:
            EventID: 1
        rewrite:
            product: windows
            service: kernel-process
        fieldmappings:
            ProcessId: ProcessID
            ParentProcessId: ParentProcessID
        # Added by Aurora Agent:
        #  - ParentImage
        #  - ParentCommandLine
        #  - ParentUser
        #  - GrandparentProcessId
        #  - GrandparentImage
        #  - GrandparentCommandLine
        #  - User
        #  - Image
        #  - ImageFileName
        #  - CurrentDirectory
        #  - IntegrityLevel
        #  - UtcTime
        #  - ParentSpoofed
        #  - ProcessTree
        #  - CommandLine
        #  - TerminalSessionId
        #  - PE information for Image
        # Not supported:
        #  - ProcessGuid
        #  - LogonGuid
        #  - LogonId
        #  - ParentProcessGuid
    systemlogger_process_creation:
        category: process_creation
        product: windows
        conditions:
            EventID: 1
        rewrite:
            product: windows
            service: systemlogger-process
        # Added by Aurora Agent
        #  - User
        #  - ParentProcessId
        #  - ParentImage
        #  - ParentUser
        #  - GrandparentProcessId
        #  - GrandparentImage
        #  - GrandparentCommandLine
        #  - ProcessId
        #  - CurrentDirectory
        #  - Image
        #  - IntegrityLevel
        #  - UtcTime
        #  - ProcessTree
        #  - PE information for Image
        # Not supported:
        #  - ProcessGuid
        #  - LogonGuid
        #  - LogonId
        #  - ParentProcessGuid
        #  - TerminalSessionId

    # Not supported: Sysmon Event ID 2 - Set file creation time

    # Sysmon Event ID 3 - Network connection
    tcpip_connect:
        category: network_connection
        product: windows
        conditions:
            EventID: 1033 # TcpConnectTcbComplete
        rewrite:
            product: windows
            service: tcpip
        # Added by Aurora Agent:
        #  - User
        #  - Image
        #  - SourcePort
        #  - DestinationPort
        #  - SourceIp
        #  - DestinationIp
        #  - DestinationIsIpv6
        #  - Initiated
        #  - Protocol
        # Not supported:
        #  - ProcessGuid
        #  - SourcePortName
        #  - DestinationPortName
        #  - SourceIsIpv6
        #  - SourceHostname
        #  - DestinationHostname
    tcpip_accept:
        category: network_connection
        product: windows
        conditions:
            EventID: 1017 # TcpAcceptListenerComplete
        rewrite:
            product: windows
            service: tcpip
        # Added by Aurora Agent:
        #  - User
        #  - Image
        #  - ParentImage
        #  - CommandLine
        #  - SourcePort
        #  - DestinationPort
        #  - SourceIp
        #  - DestinationIp
        #  - DestinationIsIpv6
        #  - Initiated
        #  - Protocol
        #  - PE information for Image
        # Not supported:
        #  - ProcessGuid
        #  - SourcePortName
        #  - DestinationPortName
        #  - SourceIsIpv6
        #  - SourceHostname
        #  - DestinationHostname

    # Sysmon Event ID 5 - Process Termination
    kernel_process_termination:
        category: process_termination
        product: windows
        conditions:
            EventID: 2
        rewrite:
            product: windows
            service: kernel-process
        fieldmappings:
            ProcessId: ProcessID
        # Added by Aurora Agent
        #  - Image
        #  - UtcTime
        # Not supported:
        #  - ProcessGuid

    # Sysmon Event ID 6 - Driver loaded
    kernel_driver_loaded:
        category: driver_load
        product: windows
        conditions:
            EventID: 213
        rewrite:
            product: windows
            service: pnp
        # Added by Aurora Agent:
        #  - ImageLoaded
        #  - PE information for ImageLoaded
        # Not supported:
        #  - UtcTime
        #  - Signed
        #  - Signature
        #  - SignatureStatus

    kernel_driver_init:
        category: driver_init
        product: windows
        conditions:
            EventID: 226
        rewrite:
            product: windows
            service: pnp

    # Sysmon Event ID 7 - Image loaded
    kernel_image_loaded:
        category: image_load
        product: windows
        conditions:
            EventID: 5
        rewrite:
            product: windows
            service: kernel-process-image
        fieldmappings:
            ProcessId: ProcessID
        # Added by Aurora Agent:
        #  - ImageLoaded
        #  - Image
        #  - CommandLine
        #  - PE information for ImageLoaded
        # Not supported:
        #  - ProcessGuid
        #  - Signed
        #  - Signature
        #  - SignatureStatus
        #  - UtcTime

    # Sysmon Event ID 8 - Create Remote Thread
    remote_thread_creation:
        category: create_remote_thread
        product: windows
        conditions:
            EventID: 3 # Thread creation
            RemoteCreation: true
        rewrite:
            product: windows
            service: kernel-process-thread
        # Added by Aurora Agent:
        #  - User
        #  - SourceImage
        #  - SourceCommandLine
        #  - SourceParentProcessId
        #  - SourceParentImage
        #  - SourceParentCommandLine
        #  - TargetImage
        #  - TargetCommandLine
        #  - TargetParentProcessId
        #  - TargetParentImage
        #  - TargetParentCommandLine
        #  - StartAddress
        #  - IsInitialThread
        #  - RemoteCreation
        #  - PE information for SourceImage
        # Not supported:
        #  - UtcTime
        #  - SourceProcessGuid
        #  - TargetProcessGuid
        #  - StartModule
        #  - StartFunction

    # Sysmon Event ID 9 - Raw Access Read
    raw-disk-access:
        product: windows
        category: raw_access_thread
        conditions:
            FileName: \Device\HarddiskVolume?
        rewrite:
            product: windows
            service: kernel-file-open
        fieldmappings:
            Device: FileName
            ProcessId: Execution_ProcessID
        # Added by Aurora Agent:
        #  - Image
        #  - CommandLine
        #  - PE information for Image
        #  - ParentImage
        #  - ParentCommandLine
        #  - User
        # Not supported:
        #  - UtcTime
        #  - ProcessGuid

    # Sysmon Event ID 10 - ProcessAccess
    audit-process-open:
        category: process_access
        product: windows
        conditions:
            EventID: 5
            IsSelf: false
        rewrite:
            product: windows
            service: api-call-auditing
        fieldmappings:
            SourceProcessId: Execution_ProcessID
            SourceThreadId: Execution_ThreadID
        # Added by Aurora Agent:
        #  - TargetImage
        #  - SourceImage
        #  - SourceCommandLine
        #  - GrantedAccess
        #  - SourceUser
        #  - TargetUser
        #  - CallTrace
        #  - CallTraceExtended
        #  - PE information for SourceImage
        # Not supported:
        #  - UtcTime
        #  - SourceProcessGUID
        #  - TargetProcessGUID
    # Sysmon Event ID 11 - File creation
    kernel-file-create:
        category: file_event
        product: windows
        conditions:
            EventID: 30
        rewrite:
            product: windows
            service: kernel-file-create
        fieldmappings:
            ProcessId: Execution_ProcessID
        # Added by Aurora Agent:
        #  - Image
        #  - CommandLine
        #  - ParentImage
        #  - ParentCommandLine
        #  - TargetFilename
        #  - User
        #  - MagicHeader
        # Not supported:
        #  - ProcessGuid
        #  - UtcTime
        #  - CreationUtcTime
    # Sysmon Event ID 12 - Registry key creation and deletion
    # Sysmon Event ID 13 - Registry key set value
    windows_kernel_registry_event:
        product: windows
        category: registry_event
        rewrite:
            product: windows
            service: systemlogger-registry
        conditions:
            EventID:
                - 10 # CreateKey
                - 12 # DeleteKey
                - 14 # SetValue
                - 15 # DeleteValue
        # Added by Aurora Agent:
        #  - Image
        #  - EventType
        #  - TargetObject
        #  - Details (EventID 14 only)
        #  - User
        # Not supported:
        #  - UtcType
        #  - ProcessGuid
    windows_kernel_registry_add:
        product: windows
        category: registry_add
        rewrite:
            product: windows
            service: systemlogger-registry
        conditions:
            EventID: 10 # CreateKey
    windows_kernel_registry_delete:
        product: windows
        category: registry_delete
        rewrite:
            product: windows
            service: systemlogger-registry
        conditions:
            EventID:
                - 12 # DeleteKey
                - 15 # DeleteValue
    windows_kernel_registry_set:
        product: windows
        category: registry_set
        rewrite:
            product: windows
            service: systemlogger-registry
        conditions:
            EventID:  14 # SetValue
    # TODO: Sysmon Event 14: Key / Value Rename
    # Not supported: Sysmon Event 15: FileCreate Stream Hash

    # Partially supported: Sysmon Event 17: Pipe created
    named-pipe-polling:
        product: windows
        category: pipe_created
        conditions:
            Type: Pipe
        fieldmappings:
            PipeName: Name
        rewrite:
            product: windows
            service: handlepolling
        # Added by Aurora Agent:
        #  - Image
        #  - CommandLine
        #  - User
        # Not supported:
        #  - UtcType
        #  - ProcessGuid
    # Pipe detection via kernel handles
    named-pipe-handles:
        product: windows
        category: pipe_created
        rewrite:
            product: windows
            service: kernel-handles
        conditions:
            Type: Pipe
        fieldmappings:
            ProcessId: Execution_ProcessID
        # Added by Aurora Agent:
        #  - Image
        #  - Pipe
        # Not supported:
        #  - UtcType
        #  - ProcessGuid

    # Not supported: Sysmon Event 18: Pipe connected
    # Not supported: Sysmon Event 19: WmiEventFilter activity detected
    # Not supported: Sysmon Event 19: WmiEventConsumer activity detected
    # Not supported: Sysmon Event 19: WmiEventConsumerToFilter activity detected

    # Sysmon Event ID 22: DNSEvent
    windows-dns-query:
        product: windows
        category: dns_query
        rewrite:
            product: windows
            service: dns-client
        conditions:
            EventID:
                - 3008
                - 3020
        fieldmappings:
            ProcessId: Execution_ProcessID
            QueryStatus: Status
        # Added by Aurora Agent:
        #  - Image
        #  - PE information for Image
        # Not supported:
        #  - UtcTime
        #  - RuleName
        #  - ProcessGuid

    # Sysmon Event ID 23: File deletion
    windows-file-deletion:
        category: file_delete
        product: windows
        conditions:
            EventID: 26
        rewrite:
            product: windows
            service: kernel-file-deletion
        fieldmappings:
            ProcessId: Execution_ProcessID
            TargetFilename: FilePath
        # Added by Aurora Agent:
        #  - User
        #  - Image
        #  - CommandLine
        #  - ParentImage
        #  - ParentCommandLine
        # Not supported:
        #  - RuleName
        #  - UtcTime
        #  - ProcessGuid
        #  - Hashes
        #  - Archived

    #PowerShell rewrites
    ps_module:
        category: ps_module
        product: windows
        conditions:
            EventID: 4103
        rewrite:
            product: windows
            service: powershell
    ps_script:
        category: ps_script
        product: windows
        conditions:
            EventID: 4104
        rewrite:
            product: windows
            service: powershell

    # Sysmon rewrites
    process_creation_1:
        category: process_creation
        product: windows
        conditions:
            EventID: 1
        rewrite:
            product: windows
            service: sysmon
    network_connection:
        category: network_connection
        product: windows
        conditions:
            EventID: 3
        rewrite:
            product: windows
            service: sysmon
    sysmon_status1:
        category: sysmon_status
        product: windows
        conditions:
            EventID:
                - 4
                - 16
        rewrite:
            product: windows
            service: sysmon
    process_terminated:
        category: process_termination
        product: windows
        conditions:
            EventID: 5
        rewrite:
            product: windows
            service: sysmon
    driver_loaded:
        category: driver_load
        product: windows
        conditions:
            EventID: 6
        rewrite:
            product: windows
            service: sysmon
    image_loaded:
        category: image_load
        product: windows
        conditions:
            EventID: 7
        rewrite:
            product: windows
            service: sysmon
    create_remote_thread:
        category: create_remote_thread
        product: windows
        conditions:
            EventID: 8
        rewrite:
            product: windows
            service: sysmon
    raw_access_thread:
        category: raw_access_thread
        product: windows
        conditions:
            EventID: 9
        rewrite:
            product: windows
            service: sysmon
    process_access:
        category: process_access
        product: windows
        conditions:
            EventID: 10
        rewrite:
            product: windows
            service: sysmon
    file_creation:
        category: file_event
        product: windows
        conditions:
            EventID: 11
        rewrite:
            product: windows
            service: sysmon
    registry_event1:
        category: registry_event
        product: windows
        conditions:
            EventID:
                - 12
                - 13
                - 14
        rewrite:
            product: windows
            service: sysmon
    registry_add:
        category: registry_add
        product: windows
        conditions:
            EventID: 12
        rewrite:
            product: windows
            service: sysmon
    registry_delete:
        category: registry_delete
        product: windows
        conditions:
            EventID: 12
        rewrite:
            product: windows
            service: sysmon
    registry_set:
        category: registry_set
        product: windows
        conditions:
            EventID: 13
        rewrite:
            product: windows
            service: sysmon
    registry_rename:
        category: registry_rename
        product: windows
        conditions:
            EventID: 14
        rewrite:
            product: windows
            service: sysmon
    create_stream_hash:
        category: create_stream_hash
        product: windows
        conditions:
            EventID: 15
        rewrite:
            product: windows
            service: sysmon
    pipe_created1:
        category: pipe_created
        product: windows
        conditions:
            EventID:
                - 17
                - 18
        rewrite:
            product: windows
            service: sysmon
    wmi_event:
        category: wmi_event
        product: windows
        conditions:
            EventID:
                - 19
                - 20
                - 21
        rewrite:
            product: windows
            service: sysmon
    dns_query:
        category: dns_query
        product: windows
        conditions:
            EventID: 22
        rewrite:
            product: windows
            service: sysmon
    file_delete:
        category: file_delete
        product: windows
        conditions:
            EventID: 23
        rewrite:
            product: windows
            service: sysmon
    sysmon_error:
        category: sysmon_error
        product: windows
        conditions:
            EventID: 255
        rewrite:
            product: windows
            service: sysmon

    # Custom log categories that Sysmon does not know
    file-access:
        product: windows
        category: file_access
        rewrite:
            product: windows
            service: kernel-file-open
        fieldmappings:
            ProcessId: Execution_ProcessID
        # Added by Aurora Agent:
        #  - Image
        #  - CommandLine
        #  - PE information for Image
        #  - ParentImage
        #  - ParentCommandLine
        #  - User
        #  - TargetFilename
    file-rename:
        product: windows
        category: file_rename
        rewrite:
            product: windows
            service: kernel-file-rename
        fieldmappings:
            ProcessId: Execution_ProcessID
        # Added by Aurora Agent:
        #  - Image
        #  - CommandLine
        #  - PE information for Image
        #  - ParentImage
        #  - ParentCommandLine
        #  - User
        #  - SourceFilename
        #  - TargetFilename
        #  - MagicHeader
    virtual-disk-mount:
        product: windows
        category: vhd_mount
        rewrite:
            product: windows
            service: vhd
        conditions:
            EventID: 1
        # Included field
        #  - VhdFileName
    handle-duplication:
        product: windows
        category: handle_duplicated
        rewrite:
            product: windows
            service: kernel-handles
        conditions:
            EventID: 34
        # Included fields:
        #  - Object
        #  - SourceProcessId
        #  - SourceHandle
        #  - TargetProcessId
        #  - TargetHandle
        #  - Type
        #  - TargetImage
        #  - SourceImage
defender-antivirus:
    product: windows
    category: antivirus
    rewrite:
        product: windows
        service: windefend
    fieldmappings:
        Signature: ThreatName
