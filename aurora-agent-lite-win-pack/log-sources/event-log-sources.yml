title: Event Log Sources
backends:
  - Aurora Agent
# this configuration differs from other configurations and can not be used
# with the sigmac tool. This configuration is used by the Aurora Agent.
logsources:
  # log source configurations for generic sigma rules
  security_process_creation:
    category: process_creation
    product: windows
    conditions:
      EventID: 4688
    rewrite:
      product: windows
      service: security
    fieldmappings:
      Image: NewProcessName
      ParentImage: ParentProcessName
  #Powershell "classic" channel
  ps_classic_start:
    category: ps_classic_start
    product: windows
    conditions:
      EventID: 400
    rewrite:
      product: windows
      service: powershell-classic
  ps_classic_provider_start:
    category: ps_classic_provider_start
    product: windows
    conditions:
      EventID: 600
    rewrite:
      product: windows
      service: powershell-classic
  ps_classic_script:
    category: ps_classic_script
    product: windows
    conditions:
      EventID: 800
    rewrite:
      product: windows
      service: powershell-classic
  # target system configurations
  windows-application:
    product: windows
    service: application
    sources:
      - "WinEventLog:Application"
  windows-security:
    product: windows
    service: security
    sources:
      - "WinEventLog:Security"
  windows-system:
    product: windows
    service: system
    sources:
      - "WinEventLog:System"
  windows-classicpowershell:
    product: windows
    service: powershell-classic
    sources: 
      - "WinEventLog:Windows PowerShell"
  windows-msexchange-management:
    product: windows
    service: msexchange-management
    sources:
      - 'WinEventLog:MSExchange Management'
  windows-openssh:
    product: windows
    service: openssh
    sources:
      - 'WinEventLog:OpenSSH/Operational'